<style>
@font-face{font-family:MammaAnna;src:url("./font.ttf") format("truetype");font-display:swap}:root{--red:#df1024;--dark:#a90818;--paper:#f8f3eb;--card:#fffdf9;--text:#2e2824;--muted:#746a62;--border:#e3d6c7;--shadow:0 14px 36px rgba(64,32,16,.12);--radius:20px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--text);background:var(--paper);font:16px/1.55 MammaAnna,system-ui,sans-serif}.container{width:min(1180px,calc(100% - 32px));margin:auto}button,input,textarea,select{font:inherit}button{min-height:44px;cursor:pointer}.hero{min-height:430px;display:flex;align-items:center;color:#fff;text-align:center;background-color:#251916;background-image:linear-gradient(90deg,rgba(22,12,11,.82),rgba(49,16,16,.53)),url("./copertina-mamma-anna.jpg?v=6");background-position:center,center 43%;background-size:auto,cover;background-repeat:no-repeat;box-shadow:var(--shadow)}h1{margin:0;font:800 clamp(2.3rem,6vw,4.8rem)/1 MammaAnna,Georgia,serif;text-shadow:0 3px 18px #000}.hero p{max-width:720px;margin:18px auto 0;text-shadow:0 2px 8px #000}.controls{position:sticky;top:0;z-index:20;padding:16px 0 8px;background:rgba(248,243,235,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.search-row{display:grid;grid-template-columns:1fr auto auto;gap:12px}.input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:13px;background:#fff;outline:none}.input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(223,16,36,.12)}#searchInput{border-radius:999px}.button{border:0;border-radius:999px;padding:10px 17px;font-weight:850}.primary{color:#fff;background:var(--red)}.primary:hover{background:var(--dark)}.neutral{color:var(--text);background:#f1e7db}.categories{display:flex;gap:8px;overflow:auto;padding:12px 0 4px}.category{flex:0 0 auto;padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-weight:800}.category.active{color:#fff;background:var(--dark)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:24px 0 56px}.card{position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:270px;padding:22px;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 22px rgba(73,47,32,.07)}.card:before{content:"";position:absolute;inset:-3px;z-index:-2;background:var(--image,none) center/cover;opacity:.85}.card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(255,253,249,.8),rgba(255,253,249,.5),rgba(255,253,249,.72))}.card h2{margin:8px 0;font:700 1.45rem/1.18 MammaAnna,Georgia,serif}.cat{color:var(--dark);font-size:.77rem;font-weight:900;text-transform:uppercase}.desc{flex:1}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.empty{grid-column:1/-1;padding:50px;text-align:center;background:var(--card);border:1px dashed #cdb9a7;border-radius:var(--radius)}dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(900px,calc(100% - 26px));max-height:calc(100dvh - 30px);padding:0;overflow:hidden;border:0;border-radius:24px;background:var(--card);box-shadow:0 30px 80px rgba(35,22,16,.38)}dialog::backdrop{background:rgba(33,23,18,.66);backdrop-filter:blur(4px)}.dialog-head{display:flex;justify-content:space-between;gap:15px;padding:20px 24px;border-bottom:1px solid var(--border)}.dialog-head h2{margin:3px 0 0;font:700 clamp(1.7rem,5vw,2.7rem)/1.08 MammaAnna,Georgia,serif}.dialog-head>div:first-child{min-width:0;flex:1 1 auto}.close{width:44px;min-width:44px;max-width:44px;height:44px;min-height:44px;max-height:44px;flex:0 0 44px;display:inline-grid;place-items:center;align-self:flex-start;padding:0;aspect-ratio:1/1;line-height:1;white-space:nowrap;overflow:hidden;border:1px solid var(--border);border-radius:50%;background:#f3eadf;font-size:1.35rem}.dialog-body{max-height:calc(100dvh - 125px);padding:24px;overflow:auto}.detail-img{width:calc(100% + 48px);margin:-24px -24px 22px}.detail-img img{display:block;width:100%;max-height:520px;object-fit:contain;background:#f5efe8}.section{margin-top:22px}.section h3{color:var(--dark)}.actions{display:flex;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}.editor{display:grid;gap:18px}.field{display:grid;gap:7px}.field label{font-weight:900}.textarea{min-height:110px;resize:vertical}.edit-section{display:grid;gap:10px;padding:15px;background:#fbf6ef;border:1px solid var(--border);border-radius:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.edit-list{display:grid;gap:9px}.edit-row{display:grid;grid-template-columns:minmax(110px,.38fr) 1fr auto;gap:8px;align-items:start}.remove{width:42px;min-width:42px;padding:0;color:var(--dark);background:#fff;border:1px solid #e2b9b9;border-radius:10px;font-size:1.25rem}.editor-footer{position:sticky;bottom:-24px;display:flex;flex-wrap:wrap;gap:10px;padding:16px 0 4px;background:var(--card)}.editor-footer .button{flex:1 1 180px}.notice{padding:12px 14px;background:#fff7e7;border:1px solid #e7c98c;border-radius:12px}.notice button{min-height:0;padding:0;border:0;background:none;color:var(--dark);font-weight:900;text-decoration:underline}.id-badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:#f1e7db;font-weight:900}.image-preview{display:none;max-width:240px;max-height:180px;object-fit:cover;border:1px solid var(--border);border-radius:14px}.image-preview.show{display:block}.toast{position:fixed;right:18px;bottom:18px;z-index:200;padding:13px 17px;color:#fff;background:#332824;border-radius:13px;opacity:0;transform:translateY(15px);transition:.25s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.container{width:calc(100% - 22px)}.hero{min-height:380px}.search-row,.grid{grid-template-columns:1fr}dialog{top:0;left:0;transform:none;width:100%;height:100dvh;max-height:100dvh;border-radius:0}.dialog-body{max-height:calc(100dvh - 90px)}.edit-row{grid-template-columns:1fr auto}.edit-row .group{grid-column:1/-1}}
</style></head>
<body><header class="hero"><div class="container"><p>Ricette di famiglia</p><h1>RICETTARIO DI MAMMA ANNA</h1><p>Cerca tra ingredienti, procedimenti, titoli e descrizioni.</p></div></header>
<section class="controls"><div class="container"><div class="search-row"><input id="searchInput" class="input" type="search" placeholder="Cerca ricette…"><button id="clearButton" class="button neutral">Azzera filtri</button><button id="addRecipeButton" class="button primary">+ Nuova ricetta</button></div><div id="categories" class="categories"></div></div></section>
<main class="container"><section id="grid" class="grid"><div class="empty">Caricamento ricettario…</div></section></main>
<dialog id="dialog"><header class="dialog-head"><div><div id="dialogCategory" class="cat"></div><h2 id="dialogTitle"></h2></div><button id="closeDialog" class="close" aria-label="Chiudi">×</button></header><div id="dialogBody" class="dialog-body"><div id="dialogContent"></div></div></dialog><div id="toast" class="toast"></div>
<script>
"use strict";
const JSON_FILE="ricettario_ricategorizzato.json",IMAGE_FOLDER="img",TOKEN_KEY="mammaAnnaGithubToken";
const GITHUB=Object.freeze({owner:"yoshinomarco",repository:"ricettario-mamma-anna",branch:"main",jsonPath:JSON_FILE});
const state={data:null,recipes:[],categories:new Map(),active:"all",query:"",currentId:null,scrollY:0,mode:"view",pendingImage:null};
const $=id=>document.getElementById(id),grid=$("grid"),dialog=$("dialog"),dialogBody=$("dialogBody"),dialogContent=$("dialogContent");
function esc(v=""){return String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"})[c])}function norm(v=""){return String(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}const imageVersions=new Map();function imagePath(id){const v=imageVersions.get(String(id));return `${IMAGE_FOLDER}/${encodeURIComponent(id)}.jpg${v?`?v=${v}`:""}`}function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),4000)}
function readToken(){try{return(localStorage.getItem(TOKEN_KEY)||"").trim()}catch{return""}}function requestToken(force=false){let t=force?"":readToken();if(t)return t;t=prompt("Inserisci il token GitHub. Verrà salvato in questo browser.")?.trim()||"";if(!t)throw Error("Token GitHub non configurato.");localStorage.setItem(TOKEN_KEY,t);return t}function changeToken(){localStorage.removeItem(TOKEN_KEY);try{requestToken(true);toast("Token aggiornato.")}catch(e){toast(e.message)}}
function searchText(r){return norm([r.title,r.description,r.source_text,...(r.ingredients||[]).map(x=>x.text),...(r.instructions||[]).map(x=>x.text)].filter(Boolean).join(" "))}function loadData(d){if(!Array.isArray(d.categories)||!Array.isArray(d.recipes))throw Error("JSON non valido");state.data=d;state.categories=new Map(d.categories.map(c=>[String(c.id),c]));state.recipes=d.recipes.map(r=>({...r,_search:searchText(r)}));renderCategories();render()}
async function autoLoad(){const v=Date.now(),urls=[`./${JSON_FILE}?v=${v}`,`https://raw.githubusercontent.com/${GITHUB.owner}/${GITHUB.repository}/${GITHUB.branch}/${GITHUB.jsonPath}?v=${v}`];for(const u of urls){try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error(`HTTP ${r.status}`);loadData(await r.json());return}catch(e){console.warn(u,e)}}grid.innerHTML='<div class="empty">Impossibile caricare automaticamente il JSON.</div>'}
function renderCategories(){const n=new Map();state.recipes.forEach(r=>n.set(String(r.category_id),(n.get(String(r.category_id))||0)+1));$("categories").innerHTML=[{id:"all",name:"Tutte",count:state.recipes.length},...state.data.categories.map(c=>({id:String(c.id),name:c.name,count:n.get(String(c.id))||0}))].map(c=>`<button class="category ${state.active===c.id?"active":""}" data-cat="${esc(c.id)}">${esc(c.name)} · ${c.count}</button>`).join("")}
function visible(){const q=norm(state.query);return state.recipes.filter(r=>(state.active==="all"||String(r.category_id)===state.active)&&(!q||r._search.includes(q)))}function render(){const list=visible();grid.innerHTML=list.length?list.map(r=>`<article class="card" data-id="${r.id}"><div class="cat">${esc(state.categories.get(String(r.category_id))?.name||"Altro")}</div><h2>${esc(r.title)}</h2><p class="desc">${esc(r.description||"Descrizione non disponibile.")}</p><div class="footer"><small>#${r.id} · ${(r.ingredients||[]).length} ingredienti</small><button class="button primary" data-open="${r.id}">Apri</button></div></article>`).join(""):'<div class="empty">Nessuna ricetta trovata.</div>';const cards=[...grid.querySelectorAll(".card")];const loadCardImage=c=>{if(c.dataset.imageLoaded)return;c.dataset.imageLoaded="1";const i=new Image;i.decoding="async";i.onload=()=>c.style.setProperty("--image",`url("${imagePath(c.dataset.id)}")`);i.onerror=()=>c.removeAttribute("data-image-loaded");i.src=imagePath(c.dataset.id)};if("IntersectionObserver" in window){const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){loadCardImage(entry.target);observer.unobserve(entry.target)}})},{rootMargin:"500px 0px"});cards.forEach(c=>observer.observe(c))}else{cards.forEach(loadCardImage)}}
function current(){return state.recipes.find(r=>Number(r.id)===Number(state.currentId))}function grouped(a,k){const g=[];(a||[]).forEach(x=>{let y=g.find(z=>z.label===(x[k]||""));if(!y){y={label:x[k]||"",items:[]};g.push(y)}y.items.push(x)});return g}
function openRecipe(id,keep=false){const r=state.recipes.find(x=>Number(x.id)===Number(id));if(!r)return;state.mode="view";state.currentId=r.id;state.scrollY=scrollY;$("dialogCategory").textContent=state.categories.get(String(r.category_id))?.name||"Altro";$("dialogTitle").textContent=r.title;let h=`<div class="detail-img"><img src="${imagePath(r.id)}" onerror="this.parentElement.remove()"></div><p>${esc(r.description||"")}</p>`;const ing=grouped(r.ingredients,"group");if(ing.length)h+=`<section class="section"><h3>Ingredienti</h3>${ing.map(g=>`${g.label?`<b>${esc(g.label)}</b>`:""}<ul>${g.items.map(x=>`<li>${esc(x.text)}</li>`).join("")}</ul>`).join("")}</section>`;const ins=grouped(r.instructions,"section");if(ins.length)h+=`<section class="section"><h3>Procedimento</h3>${ins.map(g=>`${g.label?`<b>${esc(g.label)}</b>`:""}<ol>${g.items.map(x=>`<li>${esc(x.text)}</li>`).join("")}</ol>`).join("")}</section>`;h+='<div class="actions"><button id="editButton" class="button primary">Modifica ricetta</button></div>';dialogContent.innerHTML=h;dialogBody.scrollTop=0;if(!keep&&!dialog.open)dialog.showModal();$("editButton").onclick=()=>showEditor(r,false)}
function nextLocalId(){const ids=new Set(state.recipes.map(r=>Number(r.id)).filter(Number.isSafeInteger));let id=ids.size?Math.max(...ids)+1:1;while(ids.has(id))id++;return id}function row(x,type){const g=type==="ingredient"?(x.group||""):(x.section||"");return `<div class="edit-row" data-row><input class="input group" value="${esc(g)}" placeholder="${type==="ingredient"?"Gruppo":"Sezione"} (facoltativo)"><textarea class="input text" rows="2" required>${esc(x.text||"")}</textarea><button type="button" class="remove" data-remove>×</button></div>`}
function showEditor(recipe,isNew){state.mode=isNew?"new":"edit";state.currentId=isNew?nextLocalId():recipe.id;state.pendingImage=null;$("dialogCategory").textContent=isNew?"Nuova ricetta":"Modifica ricetta";$("dialogTitle").textContent=isNew?`Ricetta #${state.currentId}`:recipe.title;const opts=state.data.categories.map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(recipe.category_id)?"selected":""}>${esc(c.name)}</option>`).join("");dialogContent.innerHTML=`<form id="editor" class="editor"><div class="notice"><span class="id-badge">ID ${state.currentId}</span> ${isNew?"L'ID definitivo viene verificato nuovamente su GitHub prima del salvataggio.":""} <button type="button" id="changeToken">Cambia token</button></div><div class="field"><label>Titolo</label><input id="editTitle" class="input" value="${esc(recipe.title||"")}" required></div><div class="field"><label>Descrizione</label><textarea id="editDesc" class="input textarea">${esc(recipe.description||"")}</textarea></div><div class="field"><label>Categoria</label><select id="editCat" class="input" required>${opts}</select></div><div class="field"><label>${isNew?"Immagine ricetta":"Sostituisci immagine (facoltativo)"}</label><input id="editImage" class="input" type="file" accept="image/*" ${isNew?"required":""}><small>${isNew?"L’immagine viene convertita in JPG e salvata come img/ID.jpg.":"Se scegli un file, l’immagine esistente img/ID.jpg verrà sovrascritta."}</small><img id="imagePreview" class="image-preview" alt="Anteprima"></div><section class="edit-section"><div class="section-head"><b>Ingredienti</b><button type="button" class="button neutral" data-add="ingredient">+ Ingrediente</button></div><div id="ingredients" class="edit-list">${(recipe.ingredients||[]).map(x=>row(x,"ingredient")).join("")}</div></section><section class="edit-section"><div class="section-head"><b>Procedimento</b><button type="button" class="button neutral" data-add="instruction">+ Passaggio</button></div><div id="instructions" class="edit-list">${(recipe.instructions||[]).map(x=>row(x,"instruction")).join("")}</div></section><div class="editor-footer"><button class="button primary" type="submit">${isNew?"Aggiungi ricetta":"Salva modifiche"}</button><button class="button neutral" type="button" id="cancelEdit">Annulla</button></div></form>`;$("editImage").onchange=e=>{state.pendingImage=e.target.files[0]||null;if(state.pendingImage){const u=URL.createObjectURL(state.pendingImage),p=$("imagePreview");p.src=u;p.classList.add("show");p.onload=()=>URL.revokeObjectURL(u)}};dialogBody.scrollTop=0;if(!dialog.open)dialog.showModal()}
function formRecipe(id){const catId=$("editCat").value,cat=state.categories.get(String(catId)),read=(box,type)=>[...$(box).querySelectorAll("[data-row]")].map((el,i)=>{const text=el.querySelector(".text").value.trim(),g=el.querySelector(".group").value.trim();return type==="ingredient"?{order:i+1,group:g,text}:{order:i+1,section:g,text}}).filter(x=>x.text),title=$("editTitle").value.trim();return{id,title,slug:norm(title).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),description:$("editDesc").value.trim(),category_id:catId,category:cat?.name||"Altro",ingredients:read("ingredients","ingredient"),instructions:read("instructions","instruction"),notes:[],sections:[],warnings:[],source_text:""}}
function headers(token){return{Accept:"application/vnd.github+json",Authorization:`Bearer ${token}`,"X-GitHub-Api-Version":"2022-11-28"}}function b64bytes(bytes){let b="";for(let i=0;i<bytes.length;i+=32768)b+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(b)}function b64text(s){return b64bytes(new TextEncoder().encode(s))}function decode64(s){const b=atob(s.replace(/\n/g,"")),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new TextDecoder().decode(a)}
async function githubFile(path,token){const u=`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repository}/contents/${path}?ref=${GITHUB.branch}`,r=await fetch(u,{headers:headers(token),cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message||`HTTP ${r.status}`);return d}async function putFile(path,content,message,token,sha){const u=`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repository}/contents/${path}`,body={message,content,branch:GITHUB.branch};if(sha)body.sha=sha;const r=await fetch(u,{method:"PUT",headers:{...headers(token),"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.message||`HTTP ${r.status}`);return d}
async function jpegBase64(file){const bitmap=await createImageBitmap(file),max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement("canvas");canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(Error("Conversione immagine non riuscita")),"image/jpeg",.88));return b64bytes(new Uint8Array(await blob.arrayBuffer()))}
async function deleteFile(path,sha,token){const u=`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repository}/contents/${path}`,r=await fetch(u,{method:"DELETE",headers:{...headers(token),"Content-Type":"application/json"},body:JSON.stringify({message:`Rollback ${path}`,sha,branch:GITHUB.branch})});if(!r.ok)console.warn("Rollback immagine non riuscito")}
async function saveNewRecipe(){if(!state.pendingImage)throw Error("Seleziona un'immagine.");const token=requestToken(),jsonFile=await githubFile(GITHUB.jsonPath,token),remote=JSON.parse(decode64(jsonFile.content));if(!Array.isArray(remote.recipes))throw Error("JSON remoto non valido.");const ids=new Set(remote.recipes.map(r=>Number(r.id)).filter(Number.isSafeInteger));let id=ids.size?Math.max(...ids)+1:1;while(ids.has(id))id++;if(ids.has(id))throw Error("ID duplicato rilevato.");const imagePath=`img/${id}.jpg`;let imageCommit=null;try{await githubFile(imagePath,token);throw Error(`Esiste già un'immagine per l'ID ${id}.`)}catch(e){if(!/Not Found|404/i.test(e.message)&&!/Esiste già/.test(e.message))throw e;if(/Esiste già/.test(e.message))throw e}const recipe=formRecipe(id),imageContent=await jpegBase64(state.pendingImage);imageCommit=await putFile(imagePath,imageContent,`Aggiungi immagine ricetta ${id}`,token);remote.recipes.push(recipe);remote.recipe_count=remote.recipes.length;try{await putFile(GITHUB.jsonPath,b64text(JSON.stringify(remote,null,2)+"\n"),`Aggiungi ricetta ${id}: ${recipe.title}`,token,jsonFile.sha)}catch(e){const sha=imageCommit?.content?.sha;if(sha)await deleteFile(imagePath,sha,token);throw e}imageVersions.set(String(id),Date.now());loadData(remote);state.currentId=null;state.mode="view";dialog.close();requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:"auto"}));toast(`Ricetta #${id} aggiunta.`)}
async function saveExisting(){
  const token=requestToken(),r=current(),backup=structuredClone(r),updated=formRecipe(r.id);
  Object.assign(r,updated,{_search:searchText(updated)});
  const file=await githubFile(GITHUB.jsonPath,token),remote=JSON.parse(decode64(file.content)),i=remote.recipes.findIndex(x=>Number(x.id)===Number(r.id));
  if(i<0){Object.assign(r,backup);throw Error("Ricetta non trovata nel JSON remoto.")}

  let oldImage=null,newImageCommit=null;
  const imageRepoPath=`img/${r.id}.jpg`;
  try{
    if(state.pendingImage){
      try{oldImage=await githubFile(imageRepoPath,token)}catch(error){if(!/Not Found|404/i.test(error.message))throw error}
      const imageContent=await jpegBase64(state.pendingImage);
      newImageCommit=await putFile(imageRepoPath,imageContent,`Aggiorna immagine ricetta ${r.id}`,token,oldImage?.sha);
    }

    remote.recipes[i]=updated;
    remote.recipe_count=remote.recipes.length;
    await putFile(GITHUB.jsonPath,b64text(JSON.stringify(remote,null,2)+"\n"),`Aggiorna ricetta ${r.id}: ${r.title}`,token,file.sha);
  }catch(error){
    Object.assign(r,backup);
    if(state.pendingImage&&newImageCommit?.content?.sha){
      try{
        if(oldImage?.content){
          await putFile(imageRepoPath,oldImage.content.replace(/\n/g,""),`Ripristina immagine ricetta ${r.id}`,token,newImageCommit.content.sha);
        }else{
          await deleteFile(imageRepoPath,newImageCommit.content.sha,token);
        }
      }catch(rollbackError){console.warn("Rollback immagine non riuscito:",rollbackError)}
    }
    throw error;
  }

  const imageWasUpdated=Boolean(state.pendingImage);
  if(imageWasUpdated)imageVersions.set(String(r.id),Date.now());
  state.pendingImage=null;
  loadData(remote);
  state.currentId=null;
  state.mode="view";
  dialog.close();
  requestAnimationFrame(()=>window.scrollTo({top:state.scrollY,left:0,behavior:"auto"}));
  toast(imageWasUpdated?"Ricetta e immagine aggiornate.":"Modifiche salvate.");
}
async function submitEditor(e){e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent="Salvataggio…";try{if(state.mode==="new")await saveNewRecipe();else await saveExisting()}catch(err){b.disabled=false;b.textContent=state.mode==="new"?"Aggiungi ricetta":"Salva modifiche";toast(`Errore: ${err.message}`)}}
$("categories").onclick=e=>{const b=e.target.closest("[data-cat]");if(b){state.active=b.dataset.cat;renderCategories();render()}};grid.onclick=e=>{const b=e.target.closest("[data-open]");if(b)openRecipe(b.dataset.open)};$("addRecipeButton").onclick=()=>{if(!state.data)return toast("Ricettario non ancora caricato.");showEditor({title:"",description:"",category_id:state.data.categories[0]?.id,ingredients:[],instructions:[]},true)};$("searchInput").oninput=e=>{state.query=e.target.value;render()};$("clearButton").onclick=()=>{state.query="";state.active="all";$("searchInput").value="";renderCategories();render()};$("closeDialog").onclick=()=>dialog.close();dialog.addEventListener("close",()=>scrollTo(0,state.scrollY));dialogContent.onclick=e=>{if(e.target.id==="cancelEdit"){state.mode==="new"?dialog.close():openRecipe(state.currentId,true)}if(e.target.id==="changeToken")changeToken();const a=e.target.closest("[data-add]");if(a){const id=a.dataset.add==="ingredient"?"ingredients":"instructions";$(id).insertAdjacentHTML("beforeend",row({},a.dataset.add))}const rm=e.target.closest("[data-remove]");if(rm)rm.closest("[data-row]").remove()};dialogContent.onsubmit=e=>{if(e.target.id==="editor")submitEditor(e)};
autoLoad();if(!readToken())setTimeout(()=>{try{requestToken()}catch{}},350);if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js",{updateViaCache:"none"}).catch(console.warn));
</script></body></html>
