<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a90818">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mamma Anna">
<link rel="manifest" href="./manifest.webmanifest"><link rel="preload" as="image" href="./copertina-mamma-anna.jpg?v=6">
<link rel="icon" type="image/png" sizes="192x192" href="./logo.png?v=6"><link rel="shortcut icon" href="./logo.png?v=6"><link rel="apple-touch-icon" href="./logo.png?v=6">
<title>RICETTARIO DI MAMMA ANNA</title>
<style>
@font-face{font-family:MammaAnna;src:url("./font.ttf") format("truetype");font-display:swap}
:root{--red:#df1024;--dark:#a90818;--paper:#f8f3eb;--card:#fffdf9;--text:#2e2824;--muted:#746a62;--border:#e3d6c7;--shadow:0 14px 36px rgba(64,32,16,.12);--radius:20px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;padding-bottom:110px;color:var(--text);background:var(--paper);font:16px/1.55 MammaAnna,system-ui,sans-serif}
.container{width:min(1180px,calc(100% - 32px));margin:auto}
button,input,textarea,select{font:inherit}
button{min-height:44px;cursor:pointer}
.hero{min-height:430px;display:flex;align-items:center;color:#fff;text-align:center;background-color:#251916;background-image:linear-gradient(90deg,rgba(22,12,11,.82),rgba(49,16,16,.53)),url("./copertina-mamma-anna.jpg?v=6");background-position:center,center 43%;background-size:auto,cover;background-repeat:no-repeat;box-shadow:var(--shadow)}
h1{margin:0;font:800 clamp(2.3rem,6vw,4.8rem)/1 MammaAnna,Georgia,serif;text-shadow:0 3px 18px #000}
.hero p{max-width:720px;margin:18px auto 0;text-shadow:0 2px 8px #000}
.controls{position:sticky;top:0;z-index:20;padding:14px 0;background:rgba(248,243,235,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}
.search-row{display:grid;grid-template-columns:1fr auto auto;gap:12px}
.input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:13px;background:#fff;outline:none}
.input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(223,16,36,.12)}
#searchInput{border-radius:999px}
.button{border:0;border-radius:999px;padding:10px 17px;font-weight:850;transition:.15s}
.button:disabled{opacity:.55;cursor:not-allowed}
.primary{color:#fff;background:var(--red)}
.primary:hover:not(:disabled){background:var(--dark)}
.neutral{color:var(--text);background:#f1e7db}

/* GRIGLIA E CARD SENZA RICARICAMENTO */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding:24px 0 56px}
.card{position:relative;isolation:isolate;display:flex;flex-direction:column;min-height:270px;padding:22px;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 22px rgba(73,47,32,.07);transition:transform .18s ease}
.card.is-hidden{display:none!important}
.card:before{content:"";position:absolute;inset:-3px;z-index:-2;background:var(--image,none) center/cover;opacity:.85}
.card:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,rgba(255,253,249,.8),rgba(255,253,249,.5),rgba(255,253,249,.72))}
.card h2{margin:8px 0;font:700 1.45rem/1.18 MammaAnna,Georgia,serif}
.cat{color:var(--dark);font-size:.77rem;font-weight:900;text-transform:uppercase}
.desc{flex:1}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.empty{grid-column:1/-1;padding:50px;text-align:center;background:var(--card);border:1px dashed #cdb9a7;border-radius:var(--radius)}

/* BOTTOM NAVIGATION BAR STILE APP */
.bottom-nav-wrap{position:fixed;left:0;right:0;bottom:14px;z-index:40;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.bottom-nav{pointer-events:auto;display:flex;align-items:center;justify-content:space-around;gap:4px;width:min(680px,100%);padding:8px 12px;background:rgba(255,253,249,.97);border:1px solid var(--border);border-radius:28px;box-shadow:0 16px 40px rgba(46,40,36,.18);backdrop-filter:blur(16px);overflow-x:auto;scrollbar-width:none}
.bottom-nav::-webkit-scrollbar{display:none}
.nav-tab{flex:1 0 auto;min-width:64px;min-height:54px;padding:6px 10px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;transition:color .2s,transform .15s}
.nav-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.nav-tab .nav-label{font-size:.73rem;font-weight:800;line-height:1;white-space:nowrap}
.nav-tab .nav-dot{width:6px;height:6px;border-radius:50%;background:transparent;transition:background .2s,transform .2s;transform:scale(0)}
.nav-tab.active{color:var(--text)}
.nav-tab.active svg{fill:currentColor;stroke:currentColor}
.nav-tab.active .nav-dot{background:var(--red);transform:scale(1)}

/* PULSANTE FLOTTANTE SOUS CHEF */
.sous-chef-fab{position:fixed;right:20px;bottom:92px;z-index:45;display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--red),var(--dark));color:#fff;font-weight:900;font-size:.98rem;box-shadow:0 12px 28px rgba(169,8,24,.38);transition:transform .2s,box-shadow .2s}
.sous-chef-fab:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(169,8,24,.48)}
.sous-chef-box{display:grid;gap:16px}
.sous-chef-answer{padding:18px;background:#fbf6ef;border:1px solid var(--border);border-radius:18px;display:grid;gap:14px}
.sous-chef-matches{display:grid;gap:10px}
.sous-chef-card{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 15px;background:#fff;border:1px solid var(--border);border-radius:14px}
.sous-chef-card b{display:block;font-size:1.05rem}
.sous-chef-card small{color:var(--muted)}

/* DIALOG E MODALI */
dialog{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(900px,calc(100% - 26px));max-height:calc(100dvh - 30px);padding:0;overflow:hidden;border:0;border-radius:24px;background:var(--card);box-shadow:0 30px 80px rgba(35,22,16,.38)}
dialog::backdrop{background:rgba(33,23,18,.66);backdrop-filter:blur(4px)}
.dialog-head{display:flex;justify-content:space-between;gap:15px;padding:20px 24px;border-bottom:1px solid var(--border)}
.dialog-head h2{margin:3px 0 0;font:700 clamp(1.7rem,5vw,2.7rem)/1.08 MammaAnna,Georgia,serif}
.dialog-head>div:first-child{min-width:0;flex:1 1 auto}
.close{width:44px;min-width:44px;max-width:44px;height:44px;min-height:44px;max-height:44px;flex:0 0 44px;display:inline-grid;place-items:center;align-self:flex-start;padding:0;aspect-ratio:1/1;line-height:1;white-space:nowrap;overflow:hidden;border:1px solid var(--border);border-radius:50%;background:#f3eadf;font-size:1.35rem}
.dialog-body{max-height:calc(100dvh - 125px);padding:24px;overflow:auto}
.detail-img{width:calc(100% + 48px);margin:-24px -24px 22px}
.detail-img img{display:block;width:100%;max-height:520px;object-fit:contain;background:#f5efe8}
.section{margin-top:22px}
.section h3{color:var(--dark)}
.actions{display:flex;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.editor{display:grid;gap:18px}
.field{display:grid;gap:7px}
.field label{font-weight:900}
.textarea{min-height:110px;resize:vertical}
.edit-section{display:grid;gap:10px;padding:15px;background:#fbf6ef;border:1px solid var(--border);border-radius:16px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.edit-list{display:grid;gap:9px}
.edit-row{display:grid;grid-template-columns:minmax(110px,.38fr) 1fr auto;gap:8px;align-items:start}
.remove{width:42px;min-width:42px;padding:0;color:var(--dark);background:#fff;border:1px solid #e2b9b9;border-radius:10px;font-size:1.25rem}
.editor-footer{position:sticky;bottom:-24px;display:flex;flex-wrap:wrap;gap:10px;padding:16px 0 4px;background:var(--card)}
.editor-footer .button{flex:1 1 180px}
.notice{padding:12px 14px;background:#fff7e7;border:1px solid #e7c98c;border-radius:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice button{min-height:0;padding:0;border:0;background:none;color:var(--dark);font-weight:900;text-decoration:underline}
.id-badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:#f1e7db;font-weight:900}
.image-preview{display:none;max-width:240px;max-height:180px;object-fit:cover;border:1px solid var(--border);border-radius:14px}
.image-preview.show{display:block}
.ai-box{padding:18px;background:linear-gradient(135deg,#fff5f5,#fffdf9);border:2px dashed var(--red);border-radius:18px;display:grid;gap:12px}
.ai-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.ai-btns{display:flex;flex-wrap:wrap;gap:10px}
.ai-status{font-weight:800;color:var(--dark);display:none;align-items:center;gap:8px}
.ai-status.show{display:flex}
.ai-progress{display:grid;gap:12px;padding:18px;border:1px solid var(--border);border-radius:16px;background:#fff}
.ai-spinner{width:36px;height:36px;margin:auto;border:4px solid #eadbd0;border-top-color:var(--red);border-radius:50%;animation:aiSpin .8s linear infinite}
.ai-error{padding:14px;color:#7c0a16;background:#fff0f1;border:1px solid #f0a8af;border-radius:13px;white-space:pre-wrap;word-break:break-word}
.ai-file-note{font-size:.9rem;color:var(--muted);text-align:center}
@keyframes aiSpin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:18px;bottom:150px;z-index:200;padding:13px 17px;color:#fff;background:#332824;border-radius:13px;opacity:0;transform:translateY(15px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){
  .container{width:calc(100% - 22px)}
  .hero{min-height:380px}
  .search-row,.grid{grid-template-columns:1fr}
  dialog{top:0;left:0;transform:none;width:100%;height:100dvh;max-height:100dvh;border-radius:0}
  .dialog-body{max-height:calc(100dvh - 90px)}
  .edit-row{grid-template-columns:1fr auto}
  .edit-row .group{grid-column:1/-1}
  .sous-chef-fab{right:14px;bottom:88px;padding:11px 16px;font-size:.92rem}
}
</style>
</head>
<body>
<header class="hero">
  <div class="container">
    <p>Ricette di famiglia</p>
    <h1>RICETTARIO DI MAMMA ANNA</h1>
    <p>Cerca tra ingredienti, procedimenti, titoli e descrizioni.</p>
  </div>
</header>

<section class="controls">
  <div class="container">
    <div class="search-row">
      <input id="searchInput" class="input" type="search" placeholder="Cerca ricette…">
      <button id="clearButton" class="button neutral">Azzera filtri</button>
      <button id="addRecipeButton" class="button primary">+ Nuova ricetta</button>
    </div>
  </div>
</section>

<main class="container">
  <section id="grid" class="grid">
    <div class="empty">Caricamento ricettario…</div>
  </section>
</main>

<!-- PULSANTE SOUS CHEF AI -->
<button id="sousChefButton" class="sous-chef-fab" type="button" aria-label="Apri Sous Chef AI">
  👨‍🍳 Sous Chef
</button>

<!-- MENU CATEGORIE IN BASSO STILE APP -->
<div class="bottom-nav-wrap">
  <nav id="categories" class="bottom-nav" aria-label="Categorie ricettario"></nav>
</div>

<dialog id="dialog">
  <header class="dialog-head">
    <div>
      <div id="dialogCategory" class="cat"></div>
      <h2 id="dialogTitle"></h2>
    </div>
    <button id="closeDialog" class="close" aria-label="Chiudi">×</button>
  </header>
  <div id="dialogBody" class="dialog-body">
    <div id="dialogContent"></div>
  </div>
</dialog>
<div id="toast" class="toast"></div>

<script>
"use strict";
const JSON_FILE="ricettario_ricategorizzato.json",IMAGE_FOLDER="img",TOKEN_KEY="mammaAnnaGithubToken",GEMINI_KEY="mammaAnnaGeminiKey";
const GITHUB=Object.freeze({owner:"yoshinomarco",repository:"ricettario-mamma-anna",branch:"main",jsonPath:JSON_FILE});
const state={data:null,recipes:[],categories:new Map(),active:"all",query:"",currentId:null,scrollY:0,mode:"view",pendingImage:null};
const $=id=>document.getElementById(id),grid=$("grid"),dialog=$("dialog"),dialogBody=$("dialogBody"),dialogContent=$("dialogContent");

function esc(v=""){return String(v).replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;"})[c])}
function norm(v=""){return String(v).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
const imageVersions=new Map();
function imagePath(id){const v=imageVersions.get(String(id));return `${IMAGE_FOLDER}/${encodeURIComponent(id)}.jpg${v?`?v=${v}`:""}`}
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),4500)}

function readToken(){try{return(localStorage.getItem(TOKEN_KEY)||"").trim()}catch{return""}}
function requestToken(force=false){let t=force?"":readToken();if(t)return t;t=prompt("Inserisci il token GitHub. Verrà salvato in questo browser.")?.trim()||"";if(!t)throw Error("Token GitHub non configurato.");localStorage.setItem(TOKEN_KEY,t);return t}
function changeToken(){localStorage.removeItem(TOKEN_KEY);try{requestToken(true);toast("Token GitHub aggiornato.")}catch(e){toast(e.message)}}

function readGeminiKey(){try{return(localStorage.getItem(GEMINI_KEY)||"").trim()}catch{return""}}
function requestGeminiKey(force=false){let k=force?"":readGeminiKey();if(k)return k;k=prompt("Inserisci la tua Google Gemini API Key (da aistudio.google.com):")?.trim()||"";if(!k)throw Error("API Key Gemini non configurata.");localStorage.setItem(GEMINI_KEY,k);return k}
function changeGeminiKey(){localStorage.removeItem(GEMINI_KEY);try{requestGeminiKey(true);toast("API Key Gemini aggiornata.")}catch(e){toast(e.message)}}

function searchText(r){return norm([r.title,r.description,r.source_text,...(r.ingredients||[]).map(x=>x.text),...(r.instructions||[]).map(x=>x.text)].filter(Boolean).join(" "))}

function categoryIcon(name="",id=""){
  const s=norm(`${name} ${id}`);
  if(id==="all"||s.includes("tutt"))return `<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg>`;
  if(s.includes("prim"))return `<svg viewBox="0 0 24 24"><path d="M4 12h16a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6Zm3-5c0 2 2 2 2 4m3-4c0 2 2 2 2 4m3-4c0 2 2 2 2 4M3 20h18"/></svg>`;
  if(s.includes("second"))return `<svg viewBox="0 0 24 24"><path d="M15.5 6.5a4.5 4.5 0 0 0-6.36 0L4.5 11.14a3.5 3.5 0 0 0 4.95 4.95l4.64-4.64a4.5 4.5 0 0 0 1.41-4.95ZM16 16l4 4m-2-6 2 2"/></svg>`;
  if(s.includes("contorn")||s.includes("verdur"))return `<svg viewBox="0 0 24 24"><path d="M17 3c-6 0-11 4-11 10 0 3 2 6 5 6 6 0 10-5 10-11 0-3-1-5-4-5ZM6 19l8-8"/></svg>`;
  if(s.includes("dolc")||s.includes("tort")||s.includes("dessert"))return `<svg viewBox="0 0 24 24"><path d="M12 7v4m0-7a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM4 15h16v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5Zm2-4h12a2 2 0 0 1 2 2v2H4v-2a2 2 0 0 1 2-2Z"/></svg>`;
  return `<svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg>`;
}

function loadData(d){
  if(!Array.isArray(d.categories)||!Array.isArray(d.recipes))throw Error("JSON non valido");
  state.data=d;
  state.categories=new Map(d.categories.map(c=>[String(c.id),c]));
  state.recipes=d.recipes.map(r=>({...r,_search:searchText(r)}));
  renderCategories();
  buildGridOnce();
  applyFilters();
}

async function autoLoad(){
  const v=Date.now(),urls=[`./${JSON_FILE}?v=${v}`,`https://raw.githubusercontent.com/${GITHUB.owner}/${GITHUB.repository}/${GITHUB.branch}/${GITHUB.jsonPath}?v=${v}`];
  for(const u of urls){
    try{
      const r=await fetch(u,{cache:"no-store"});
      if(!r.ok)throw Error(`HTTP ${r.status}`);
      const text=await r.text();
      if(!text.trim())throw Error("Risposta JSON vuota");
      let data;try{data=JSON.parse(text)}catch(e){throw Error(`JSON non valido: ${e.message}`)}
      loadData(data);return;
    }catch(e){console.warn(u,e)}
  }
  grid.innerHTML='<div class="empty">Impossibile caricare automaticamente il JSON.</div>';
}

function renderCategories(){
  const tabs=[
    {id:"all",name:"Tutto"},
    ...state.data.categories.map(c=>({id:String(c.id),name:c.name}))
  ];
  $("categories").innerHTML=tabs.map(c=>`
    <button type="button" class="nav-tab ${state.active===c.id?"active":""}" data-cat="${esc(c.id)}">
      ${categoryIcon(c.name,c.id)}
      <span class="nav-label">${esc(c.name)}</span>
      <span class="nav-dot"></span>
    </button>`).join("");
}

function updateActiveCategoryTab(){
  for(const btn of $("categories").querySelectorAll(".nav-tab")){
    btn.classList.toggle("active",btn.dataset.cat===state.active);
  }
}

// Costruisce il DOM delle ricette UNA SOLA VOLTA per evitare ricaricamenti
function buildGridOnce(){
  if(!state.recipes.length){
    grid.innerHTML='<div class="empty">Nessuna ricetta presente nel database.</div>';
    return;
  }
  grid.innerHTML=state.recipes.map(r=>`
    <article class="card" data-id="${r.id}" data-cat="${esc(String(r.category_id))}">
      <div class="cat">${esc(state.categories.get(String(r.category_id))?.name||"Altro")}</div>
      <h2>${esc(r.title)}</h2>
      <p class="desc">${esc(r.description||"Descrizione non disponibile.")}</p>
      <div class="footer">
        <small>#${r.id} · ${(r.ingredients||[]).length} ingredienti</small>
        <button class="button primary" data-open="${r.id}">Apri</button>
      </div>
    </article>`).join("")+`<div id="emptyFilterState" class="empty" hidden>Nessuna ricetta trovata.</div>`;

  const cards=[...grid.querySelectorAll(".card")];
  const loadCardImage=c=>{
    if(c.dataset.imageLoaded)return;
    c.dataset.imageLoaded="1";
    const i=new Image;
    i.decoding="async";
    i.onload=()=>c.style.setProperty("--image",`url("${imagePath(c.dataset.id)}")`);
    i.onerror=()=>c.removeAttribute("data-image-loaded");
    i.src=imagePath(c.dataset.id);
  };
  if("IntersectionObserver" in window){
    const observer=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting){loadCardImage(entry.target);observer.unobserve(entry.target)}
      });
    },{rootMargin:"600px 0px"});
    cards.forEach(c=>observer.observe(c));
  }else{
    cards.forEach(loadCardImage);
  }
}

// Filtra istantaneamente mostrando/nascondendo le card già renderizzate
function applyFilters(){
  const q=norm(state.query);
  const recipeMap=new Map(state.recipes.map(r=>[String(r.id),r]));
  let shown=0;
  for(const card of grid.querySelectorAll(".card")){
    const r=recipeMap.get(String(card.dataset.id));
    const match=Boolean(r)&&(state.active==="all"||String(r.category_id)===state.active)&&(!q||r._search.includes(q));
    card.classList.toggle("is-hidden",!match);
    if(match)shown++;
  }
  const emptyEl=$("emptyFilterState");
  if(emptyEl)emptyEl.hidden=shown>0;
}

// --- SOUS CHEF AI ---
function showSousChef(){
  if(!state.recipes.length)return toast("Attendi il caricamento del ricettario.");
  state.mode="souschef";
  state.scrollY=scrollY;
  $("dialogCategory").textContent="Assistente Culinario AI";
  $("dialogTitle").textContent="👨‍🍳 Sous Chef di Mamma Anna";
  dialogContent.innerHTML=`
    <div class="sous-chef-box">
      <div class="notice">
        <span>Chiedi cosa cucinare con gli ingredienti che hai in casa: il Sous Chef legge tutto il ricettario e ti consiglia i piatti migliori.</span>
        <button type="button" id="changeGeminiKey">Configura API Key Gemini</button>
      </div>
      <form id="sousChefForm" class="editor">
        <div class="field">
          <label for="sousChefInput">Cosa hai in dispensa o cosa vorresti preparare?</label>
          <textarea id="sousChefInput" class="input textarea" placeholder="Es. Ho solamente 2 carote e una cipolla, che posso cucinare?" required></textarea>
        </div>
        <button id="sousChefSubmit" class="button primary" type="submit">✨ Chiedi al Sous Chef</button>
      </form>
      <div id="sousChefResult"></div>
    </div>`;
  $("sousChefForm").onsubmit=handleSousChefSubmit;
  dialogBody.scrollTop=0;
  if(!dialog.open)dialog.showModal();
  setTimeout(()=>$("sousChefInput")?.focus(),60);
}

async function askGeminiSousChef(userQuery,apiKey){
  const catalog=state.recipes.map(r=>({
    id:Number(r.id),
    title:r.title,
    category:state.categories.get(String(r.category_id))?.name||"Altro",
    ingredients:(r.ingredients||[]).map(i=>i.text).join(", ")
  }));

{"reply":"...","matches":[{"id":1,"reason":"..."}]}`;

async function aiImageBase64(file){
  const bitmap=await createImageBitmap(file),max=1200,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
  const canvas=document.createElement("canvas");canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);
  canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error("Compressione foto non riuscita")),"image/jpeg",.78));
  return b64bytes(new Uint8Array(await blob.arrayBuffer()));
}

async function transcribeWithGemini(files,apiKey,onProgress=()=>{}){
  onProgress("Ottimizzazione delle foto…","Preparazione immagini");
  const b64List=await Promise.all([...files].map(f=>aiImageBase64(f)));
  const cats=state.data.categories.map(c=>({id:String(c.id),name:c.name}));
  const prompt=`Trascrivi la ricetta in italiano. Scegli category_id solo tra ${JSON.stringify(cats)}. Restituisci SOLO JSON valido con title, description, category_id, ingredients (group,text), instructions (section,text).`;
  const parts=[{text:prompt},...b64List.map(data=>({inline_data:{mime_type:"image/jpeg",data}}))];
  const models=["gemini-3.5-flash-lite","gemini-3.8-flash","gemini-3.6-flash"];
  let lastError=null;
  for(let modelIndex=0;modelIndex<models.length;modelIndex++){
    const model=models[modelIndex];
    onProgress(modelIndex===0?"Lettura e trascrizione della ricetta…":`Tentativo automatico ${modelIndex+1} di ${models.length}…`,`Modello in uso: ${model}`);
    const url=`https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`;
    let res;
    try{
      const generationConfig={responseMimeType:"application/json",temperature:0.1,maxOutputTokens:3072};
      if(model!=="gemini-3.5-flash-lite")generationConfig.thinkingConfig={thinkingLevel:"LOW"};
      res=await fetch(url,{method:"POST",cache:"no-store",headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},body:JSON.stringify({contents:[{parts}],generationConfig})});
    }catch(fetchError){
      lastError=fetchError;
      if(modelIndex<models.length-1)continue;
      throw fetchError;
    }
    if(!res.ok){
      const e=await res.json().catch(()=>({}));
      const message=e.error?.message||`Errore Gemini HTTP ${res.status}`;
      lastError=Error(message);
      const busy=res.status===503||/high demand|overloaded|unavailable|capacity|try again later/i.test(message);
      if(busy&&modelIndex<models.length-1)continue;
      throw lastError;
    }
    if(!res.body)throw Error("Il browser non supporta la risposta streaming.");
    const reader=res.body.getReader(),decoder=new TextDecoder();let buffer="",jsonText="",chunks=0,streamError=null;
    const consumeEvent=event=>{
      for(const rawLine of event.split(/\r?\n/)){
        const line=rawLine.trim();if(!line.startsWith("data:"))continue;
        const payload=line.slice(5).trim();if(!payload||payload==="[DONE]")continue;
        let obj;try{obj=JSON.parse(payload)}catch(parseError){console.warn("Blocco SSE non JSON:",payload);continue}
        if(obj.error){streamError=Error(obj.error.message||"Errore streaming Gemini");return}
        const candidate=obj.candidates?.[0];
        const text=(candidate?.content?.parts||[]).filter(part=>!part.thought).map(part=>part.text||"").join("");
        if(text){jsonText+=text;chunks++;onProgress("Lettura e trascrizione della ricetta…",`${model}: ricevuti ${chunks} blocchi`)}
        if(!text&&candidate?.finishReason&&candidate.finishReason!=="STOP")console.warn("Gemini finishReason:",candidate.finishReason,candidate.safetyRatings||"");
      }
    };
    while(true){
      const {done,value}=await reader.read();
      if(value)buffer+=decoder.decode(value,{stream:!done});
      const events=buffer.split(/\r?\n\r?\n/);buffer=events.pop()||"";
      for(const event of events)consumeEvent(event);
      if(streamError||done)break;
    }
    buffer+=decoder.decode();
    if(buffer.trim())consumeEvent(buffer);
    if(streamError){
      const busy=/high demand|overloaded|unavailable|capacity|try again later/i.test(streamError.message);
      if(busy&&modelIndex<models.length-1){lastError=streamError;continue}
      throw streamError;
    }
    if(!jsonText.trim()){lastError=Error(`${model} ha risposto senza contenuto testuale. Controlla la console per finishReason o blocchi di sicurezza.`);if(modelIndex<models.length-1)continue;throw lastError}
    try{return JSON.parse(jsonText)}catch(e){throw Error(`Risposta JSON non valida da ${model}: ${e.message}`)}
  }
  throw lastError||Error("Nessun modello Gemini disponibile.");
}

async function githubFile(path,token){
  const u=`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repository}/contents/${path}?ref=${encodeURIComponent(GITHUB.branch)}`;
  const r=await fetch(u,{headers:headers(token),cache:"no-store"});
  const metadata=await githubResponse(r,"GitHub Contents API");
  if(metadata?.content)return metadata;
  if(metadata?.git_url){
    const br=await fetch(metadata.git_url,{headers:headers(token),cache:"no-store"});
    const blob=await githubResponse(br,"GitHub Blob API");
    if(blob?.content)return {...metadata,content:blob.content,encoding:blob.encoding||"base64"};
  }
  throw Error(`Impossibile leggere il contenuto di ${path} da GitHub.`);
}
async function putFile(path,content,message,token,sha){
  const u=`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repository}/contents/${path}`;
  const body={message,content,branch:GITHUB.branch};if(sha)body.sha=sha;
  const r=await fetch(u,{method:"PUT",headers:{...headers(token),"Content-Type":"application/json"},body:JSON.stringify(body)});
  return githubResponse(r,"GitHub salvataggio");
}
async function jpegBase64(file){const bitmap=await createImageBitmap(file),max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement("canvas");canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(Error("Conversione immagine non riuscita")),"image/jpeg",.88));return b64bytes(new Uint8Array(await blob.arrayBuffer()))}

function parseGithubJson(file,path){
  if(!file?.content)throw Error(`GitHub non ha restituito il contenuto di ${path}.`);
  const text=decode64(file.content).replace(/^\uFEFF/,"").trim();
  if(!text)throw Error(`${path} è vuoto.`);
  try{return JSON.parse(text)}catch(e){throw Error(`${path} contiene JSON non valido: ${e.message}`)}
}
async function deleteFile(path,sha,token){const u=`https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repository}/contents/${path}`,r=await fetch(u,{method:"DELETE",headers:{...headers(token),"Content-Type":"application/json"},body:JSON.stringify({message:`Rollback ${path}`,sha,branch:GITHUB.branch})});if(!r.ok)console.warn("Rollback immagine non riuscito")}

async function saveNewRecipe(){
  if(!state.pendingImage)throw Error("La foto da salvare non è più disponibile.");
  if(!$("editTitle")\vert{}\vert{}!$("editCat")||!$("ingredients")\vert{}\vert{}!$("instructions"))throw Error("I dati della preview non sono più disponibili. Annulla e ripeti la scansione.");
  if(!$("editTitle").value.trim())throw Error("Il titolo della ricetta è vuoto.");
  const token=requestToken(),jsonFile=await githubFile(GITHUB.jsonPath,token),remote=parseGithubJson(jsonFile,GITHUB.jsonPath);
  if(!Array.isArray(remote.recipes))throw Error("JSON remoto non valido.");
  const ids=new Set(remote.recipes.map(r=>Number(r.id)).filter(Number.isSafeInteger));
  let id=ids.size?Math.max(...ids)+1:1;while(ids.has(id))id++;
  const imgRepoPath=`img/${id}.jpg`;
  let imageCommit=null;
  try{await githubFile(imgRepoPath,token);throw Error(`Esiste già un'immagine per l'ID ${id}.`)}catch(e){if(!/Not Found|404/i.test(e.message)&&!/Esiste già/.test(e.message))throw e;if(/Esiste già/.test(e.message))throw e}
  const recipe=formRecipe(id),imageContent=await jpegBase64(state.pendingImage);
  imageCommit=await putFile(imgRepoPath,imageContent,`Aggiungi immagine ricetta ${id}`,token);
  remote.recipes.push(recipe);remote.recipe_count=remote.recipes.length;
  try{await putFile(GITHUB.jsonPath,b64text(JSON.stringify(remote,null,2)+"\n"),`Aggiungi ricetta ${id}: ${recipe.title}`,token,jsonFile.sha)}catch(e){const sha=imageCommit?.content?.sha;if(sha)await deleteFile(imgRepoPath,sha,token);throw e}
  imageVersions.set(String(id),Date.now());loadData(remote);state.currentId=null;state.mode="view";dialog.close();
  requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:"auto"}));toast(`Ricetta #${id} (${recipe.title}) salvata su GitHub!`);
}

async function saveExisting(){
  const token=requestToken(),r=current(),backup=structuredClone(r),updated=formRecipe(r.id);
  Object.assign(r,updated,{_search:searchText(updated)});
  const file=await githubFile(GITHUB.jsonPath,token),remote=parseGithubJson(file,GITHUB.jsonPath),i=remote.recipes.findIndex(x=>Number(x.id)===Number(r.id));
  if(i<0){Object.assign(r,backup);throw Error("Ricetta non trovata nel JSON remoto.")}
  let oldImage=null,newImageCommit=null;
  const imageRepoPath=`img/${r.id}.jpg`;
  try{
    if(state.pendingImage){
      try{oldImage=await githubFile(imageRepoPath,token)}catch(error){if(!/Not Found|404/i.test(error.message))throw error}
      const imageContent=await jpegBase64(state.pendingImage);
      newImageCommit=await putFile(imageRepoPath,imageContent,`Aggiorna immagine ricetta ${r.id}`,token,oldImage?.sha);
    }
    remote.recipes[i]=updated;remote.recipe_count=remote.recipes.length;
    await putFile(GITHUB.jsonPath,b64text(JSON.stringify(remote,null,2)+"\n"),`Aggiorna ricetta ${r.id}: ${r.title}`,token,file.sha);
  }catch(error){
    Object.assign(r,backup);
    if(state.pendingImage&&newImageCommit?.content?.sha){
      try{if(oldImage?.content)await putFile(imageRepoPath,oldImage.content.replace(/\n/g,""),`Ripristina immagine ricetta ${r.id}`,token,newImageCommit.content.sha);else await deleteFile(imageRepoPath,newImageCommit.content.sha,token)}catch(rollbackError){console.warn("Rollback immagine non riuscito:",rollbackError)}
    }
    throw error;
  }
  const imageWasUpdated=Boolean(state.pendingImage);
  if(imageWasUpdated)imageVersions.set(String(r.id),Date.now());
  state.pendingImage=null;loadData(remote);state.currentId=null;state.mode="view";dialog.close();
  requestAnimationFrame(()=>window.scrollTo({top:state.scrollY,left:0,behavior:"auto"}));
  toast(imageWasUpdated?"Ricetta e immagine aggiornate.":"Modifiche salvate.");
}

async function submitEditor(e){e.preventDefault();const b=$("submitBtn");b.disabled=true;b.textContent="Salvataggio…";try{if(state.mode==="new")await saveNewRecipe();else await saveExisting()}catch(err){b.disabled=false;b.textContent=state.mode==="new"?"Aggiungi ricetta":"Salva modifiche";toast(`Errore: ${err.message}`)}}

$("categories").onclick=e=>{
  const b=e.target.closest("[data-cat]");
  if(b&&state.active!==b.dataset.cat){
    state.active=b.dataset.cat;
    updateActiveCategoryTab();
    applyFilters();
  }
};
grid.onclick=e=>{const b=e.target.closest("[data-open]");if(b)openRecipe(b.dataset.open)};
$("addRecipeButton").onclick=()=>{if(!state.data)return toast("Ricettario non ancora caricato.");showAiSourceChooser()};
$("sousChefButton").onclick=showSousChef;
$("searchInput").oninput=e=>{state.query=e.target.value;applyFilters()};
$("clearButton").onclick=()=>{state.query="";state.active="all";$("searchInput").value="";updateActiveCategoryTab();applyFilters()};
$("closeDialog").onclick=()=>dialog.close();
dialog.addEventListener("close",()=>scrollTo(0,state.scrollY));
dialogContent.onclick=e=>{
  if(e.target.id==="cancelEdit"){state.mode==="new"?dialog.close():openRecipe(state.currentId,true)}
  if(e.target.id==="changeToken")changeToken();
  if(e.target.id==="changeGeminiKey")changeGeminiKey();
  const openRecBtn=e.target.closest("[data-open-recipe]");
  if(openRecBtn)openRecipe(openRecBtn.dataset.openRecipe,true);
  const a=e.target.closest("[data-add]");
  if(a){const id=a.dataset.add==="ingredient"?"ingredients":"instructions";$(id).insertAdjacentHTML("beforeend",row({},a.dataset.add))}
  const rm=e.target.closest("[data-remove]");
  if(rm)rm.closest("[data-row]").remove();
};
dialogContent.onsubmit=e=>{if(e.target.id==="editor")submitEditor(e)};
autoLoad();
if(!readToken())setTimeout(()=>{try{requestToken()}catch{}},350);
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js",{updateViaCache:"none"}).catch(console.warn));
</script>
